
# UC1: Login
# UC2.1: Opret konto
# UC2.2: Opdater konto
# UC2.3: Slet konto
# UC2.4: Læs konto

openapi: 3.0.0
info:
  version: 1.0.0
  title: Sample API
  description: A sample API to illustrate OpenAPI concepts

servers:
  # - url: https://api.example.com
  #   description: Production server
  - url: http://localhost:8080/api/v1/account/
    description: Local development server
  - url: https://localhost:8080/api/v1/account/
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /login:
    post:
      summary: ""
      description: Authenticate user and returns a JWT token (UC1), TODO - Rate-liming on this endpoint (very vulnerable for hacker attacks)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: johnDoe@mail.com
                  description: ""
                password:
                  type: string
                  format: password
                  description: ""
              required:
                - username
                - password
      responses:
        '200':
          description: Succesful login, returns a JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token to be used in Authorization header
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '401':
          description: Unauthorized, invalid credentials, doesn't verify if email exist it will only help hackers
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invalid username or password."

  /createAccount:
    post:
      summary: ""
      description: User creates an account (UC2.1), TODO - Rate-liming on this endpoint (very vulnerable for hacker attacks)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: Harry
                  description: ""
                surname:
                  type: string
                  example: Potter
                  description: ""
                email:
                  type: string
                  example: harryPotter@mail.com
                  description: ""
                phone:
                  type: string
                  example: "99 99 99 99"
                  format: phone
                  description: "TODO: Consider country codes as part of the system and format for the phone-number"
                birthDate:
                  type: string
                  format: date
                  example: 31/12/1999
                  description: "DD/MM/YYYY"
                gender:
                  type: string
                  example: male
                  description: ""
                password:
                  type: string
                  format: password
                  description: ""
              required:
                - firstName
                - surname
                - email
                - phone
                - birthDate
                - gender
                - password
      responses:
        '201':
          description: System creates account and signs in new user by returning JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token to be used in Authorization header
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Invalid information provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "One or more of you person information are not entered correctly"
        '409':
          description: email is already taken, vulnerable for attackers but a service for real users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email is already taken by another account"

  /updateAccount:
    put:
      summary: ""
      description: User updates his / her account (UC2.2), old information has already been provided to properties so user doesn't have to type them again if it's not necessary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  format: guid
                  example: 9fb538b8-57ca-4497-9911-57f780befce2
                  description: ""
                firstName:
                  type: string
                  example: Harry
                  description: ""
                surname:
                  type: string
                  example: Potter
                  description: ""
                email:
                  type: string
                  example: harryPotter@mail.com
                  description: ""
                phone:
                  type: string
                  example: "99 99 99 99"
                  format: phone
                  description: "TODO: Consider country codes as part of the system and format for the phone-number"
                birthDate:
                  type: string
                  format: date
                  example: 31/12/1999
                  description: "DD/MM/YYYY"
                gender:
                  type: string
                  example: male
                  description: ""
                password:
                  type: string
                  format: password
                  description: ""
              required:
                - accountId
      responses:
        '200':
          description: System has updated new account informations entered correctly
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Your account information has been updated succesfully"
        '400':
          description: Invalid information provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "One or more of you person information are not entered correctly"
        '401':
          description: User is not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "You need to sign in before you can update your account"
        '403':
          description: User tries to update another user's account
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "You can only update your own account"
        '409':
          description: email is already taken, vulnerable for attackers but a service for real users
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email is already taken by another account"

  /getAccount/{id}:
    get:
      summary: ""
      description: User access information of his / her own account (UC2.?)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            description: id is a guid
            type: string
            example: ex. 9fb538b8-57ca-4497-9911-57f780befce2
      responses:
        '200':
          description: System returns user's own account information, TODO - consider security
          content:
            application/json:
              schema:
                type: object
                properties:
                  firstName:
                    type: string
                    example: Harry
                    description: ""
                  surname:
                    type: string
                    example: Potter
                    description: ""
                  email:
                    type: string
                    example: harryPotter@mail.com
                    description: ""
                  phone:
                    type: string
                    example: "99 99 99 99"
                    format: phone
                    description: "TODO: Consider country codes as part of the system and format for the phone-number"
                  birthDate:
                    type: string
                    format: date
                    example: 31/12/1999
                    description: "DD/MM/YYYY"
                  gender:
                    type: string
                    example: male
                    description: ""
                  password:
                    type: string
                    format: password
                    description: ""
        '401':
          description: User is not signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "You need to sign in before you can access your account information"
        '403':
          description: User tries to access another user's account
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "You don't have permission to access this account"
        '404':
          description: User tries to access an account that doesn't exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Account does not exist"





